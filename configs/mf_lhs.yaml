# Latin-hypercube cheap runs plus about 30% of solver time on fine runs.
name: mf_lhs
strategy: mf_lhs
strategy_args: {high_share: 0.3, high_pick: random}   # share of solver seconds on fine runs
seed: 0
budget_s: 3600   # solver CPU seconds for training runs
init: {n_low: 60, n_high: 10}   # nested: the high cases are the first low cases
batch: 200   # cheap runs per round
max_rounds: 40   # safety cap; the budget ends the run
test: {n_runs: 100, seed: 777}   # held-out fine-mesh test set
fidelities:
  low: {nz: 4, dh_frac: 0.04}
  high: {nz: 12}
cache_dir: cache
workers: 4
gp: {iters: 200, restarts: 2}   # same in every config
mf_model: {rho: 1.0, delta: auto}   # correction picked each round by cross-validation
