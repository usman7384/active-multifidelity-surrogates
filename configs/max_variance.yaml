# Fine runs where the GP is most unsure.
name: max_variance
strategy: max_variance
strategy_args: {pool: 2048, min_dist: 0.15}
seed: 0
budget_s: 3600   # solver CPU seconds for training runs
init: {n_runs: 20}
batch: 10
test: {n_runs: 100, seed: 777}   # held-out fine-mesh test set
fidelities:
  low: {nz: 4, dh_frac: 0.04}
  high: {nz: 12}
cache_dir: cache
workers: 4
gp: {iters: 200, restarts: 2}   # same in every config
