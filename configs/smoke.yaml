# Seconds-scale end-to-end check: coarse mesh as "high", tiny sets, short GP fits.
name: smoke
strategy: max_variance
seed: 0
budget_s: 60
max_rounds: 2
init: {n_runs: 4}
batch: 2
test: {n_runs: 3, seed: 12345}
fidelities:
  low: {nz: 3, dh_frac: 0.04}
  high: {nz: 4, dh_frac: 0.04}
cache_dir: cache
workers: 4
gp: {iters: 60, restarts: 1}
